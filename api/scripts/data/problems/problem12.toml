name = "Grafos Ponderado BFS"
difficulty = "medium"
time_limit = 1000
memory_limit = 500
username = "superadmin"

description = '''
Implemente o algoritmo de busca em largura em um Grafo não-orientado e ponderado. Na busca, partindo do vértice de origem 's', devem ser acessados todos os vértices à uma distância d <= dist_limiar.

O grafo deve ser implementado por meio de uma lista de adjacências, em que a lista de cada vértice armazena os vértices vizinhos de acordo com a ordem em que cada conexão foi criada. Por exemplo, se o vértice 'a' é conectado ao vértice 'c', e depois aos vértices 'b' e 'e' (nessa ordem), a lista do vértice 'a' deve estar organizada da seguinte forma:

a: 'c' -> 'b' -> 'e' -> NULL.
'''

problem_input = '''
A entrada contém o número de vértices do grafo e a distância máxima a ser utilizada na busca em largura, seguida de uma série de conexões. Cada conexão é composta do valor inteiro de dois vértices, seguido do peso da conexão (float). Após cada conexão, um inteiro representa se outra conexão será realizada ou não.

ex:

5 0.3 (informa que o grafo possui 5 vértices e que a distância máxima aceita na busca é 0.3)

0 4 0.3 1 (liga os vértices 0 e 4 com uma aresta de peso 0.3)

2 3 0.6 1 (liga os vértices 2 e 3 com uma aresta de peso 0.6)

1 3 0.4 0 (liga os vértices 1 e 3 com uma aresta de peso 0.4 e encerra a leitura)
'''

problem_output = '''
Após o grafo ser montado, deve ser impresso na tela a lista de adjacências de cada vértice. Em seguida, a busca em largura deve ser executada para cada vértice, do vértice 0 ao vértice de maior valor inteiro. Após a busca deve ser impressos os nós encontrados na BFS de cada nó.


obs1:

Caso a lista de adjacência esteja vazia, imprima "Lista vazia!"

obs2: no percurso em largura, imprima o própria nó de origem, assumindo que a distância de um vértice para ele mesmo é igual a zero.
'''

