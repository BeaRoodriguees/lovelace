name = "Ambrósio desastrado"
difficulty = "very_easy"
time_limit = 1000
memory_limit = 500

description = '''
O jovem Ambrósio estava decifrando uma mensagem escrevendo letra por letra em pedaços de papel. Em cada pedaço Ambrósio escreveu uma letra e um número representando sua posição, da seguinte forma:

1 M
2 e
3 n
4 s
5 a
6 g
7 e
8 m

Porém Ambrósio esbarrou na mesa e bagunçou todos os pedaços. Ajude-o a reorganizar a mensagem.
'''

problem_input = '''
Um inteiro N representando a quantidade de pedaços. (0 < N < 200)
N linhas contendo um inteiro M e um caractere C. (1 < M <= N)
'''

problem_output = '''
Todos os caracteres dos pedaços na ordem correta.
'''

