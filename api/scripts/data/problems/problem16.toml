name = "Triângulo de Pascal"
difficulty = "very_hard"
time_limit = 1000
memory_limit = 500

description = '''
O Triângulo de Pascal é um triângulo aritmético infinito onde são dispostos os coeficientes das expansões binominais. Os números que compõem o triângulo apresentam diversas propriedades e relações. Um dessas propriedades é a chamada relação de Stifel, em que se pode afirmar que um número de uma determinada linha n corresponde à soma do elemento de mesma do posição da linha n-1 com o elemento da posição anterior também da linha n-1. Com base nessa relação, construa uma programa que receba com entrada um número inteiro, representando o número de linhas do triângulo e, em seguida, exiba o triângulo de pascal até a linha informada. Lembre-se que o primeiro elemento de qualquer linha sempre é 1 e que uma linha n, possui sempre n elementos.

ATENÇÃO PARA A FORMATAÇÃO: utilize um 'espaço' para separar os números de uma mesma linha. Exiba o triângulo na forma de um triângulo retângulo.

DICA: facilita se você utilizar matrizes.
'''

problem_input = '''
Um número inteiro k que representa o número de linhas do triângulo que serão exibidas.
'''

problem_output = '''
O triângulo de Pascal até a linha k. 
'''

[[testcases]]
input = '''
4
'''
output = '''
1
1 1
1 2 1
1 3 3 1
'''
is_sample = true

[[testcases]]
input = '''
2
'''
output = '''
1
1 1
'''
is_sample = true

[[tags]]
name = "array bidimensional"
